providers = []

[phases.setup]
nixPkgs = ["nodejs_22", "maven", "jdk"]

[phases.install]
cmds = [
  "npm ci",
  "cd backend && mvn dependency:resolve -B -q"
]

[phases.build]
cmds = [
  "echo '=== Building frontend ==='",
  "rm -rf backend/src/main/resources/static/assets backend/src/main/resources/static/index.html",
  "npm run build",
  "cp -r dist/* backend/src/main/resources/static/",
  "echo '=== Building backend ==='",
  "cd backend && mvn clean package -DskipTests -B -q",
  "echo '=== Build complete ==='"
]

[start]
cmd = "java -jar backend/target/ai-chat-backend-1.0.0.jar"
